global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['monitoring_cadvisor:8080']

  - job_name: node_exporter
    static_configs:
      - targets: ['monitoring_node_exporter:9100']

  - job_name: mariadb
    static_configs:
      - targets: ['monitoring_mysqld_exporter:9104']

  - job_name: redis
    static_configs:
      - targets: ['monitoring_redis_exporter:9121']

  - job_name: nginx
    static_configs:
      - targets: ['monitoring_nginx_exporter:9113']

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  - job_name: service-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://nginx/status.php
          - http://minio:9000/minio/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitoring_blackbox_exporter:9115
