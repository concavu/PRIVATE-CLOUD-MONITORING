global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['monitoring_cadvisor:8080']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['monitoring_node_exporter:9100']
