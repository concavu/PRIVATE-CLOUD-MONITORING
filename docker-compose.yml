services:
  # ============================================================================
  # 1. EDGE SECURITY & REVERSE PROXY LAYER
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: proxy_edge_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Static asset sharing: Nginx serves CSS/JS/images directly without hitting PHP-FPM
      - nextcloud_web:/var/www/html:ro
    networks:
      frontend_net:
        ipv4_address: 172.20.10.2
      storage_net:
        ipv4_address: 172.20.30.2
      monitoring_net: {}
    depends_on:
      nextcloud:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 2. CORE APPLICATION (NEXTCLOUD FPM)
  # ============================================================================
  nextcloud:
    image: nextcloud:30-fpm-alpine
    container_name: nextcloud_app_core
    restart: unless-stopped
    volumes:
      - nextcloud_web:/var/www/html
    environment:
      # Database Environment
      - MYSQL_HOST=mariadb:3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

      # Redis Memory Caching & Transactional File Locking
      - REDIS_HOST=redis
      - REDIS_HOST_PORT=6379
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}

      # MinIO S3 Object Storage as Primary Storage
      - OBJECTSTORE_S3_HOST=minio
      - OBJECTSTORE_S3_PORT=${MINIO_PORT}
      - OBJECTSTORE_S3_BUCKET=${MINIO_BUCKET_NAME}
      - OBJECTSTORE_S3_KEY=${MINIO_ROOT_USER}
      - OBJECTSTORE_S3_SECRET=${MINIO_ROOT_PASSWORD}
      - OBJECTSTORE_S3_STORAGE_CLASS=STANDARD
      - OBJECTSTORE_S3_SSL=false
      - OBJECTSTORE_S3_REGION=us-east-1
      - OBJECTSTORE_S3_USEPATH_STYLE=true
      - OBJECTSTORE_S3_AUTOCREATE=true

      # Security & Proxy Settings
      - OVERWRITEHOST=${DOMAIN_NAME}
      - OVERWRITEPROTOCOL=https
      - TRUSTED_PROXIES=172.20.10.2 127.0.0.1
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${DOMAIN_NAME} localhost 127.0.0.1 172.20.10.2
    networks:
      frontend_net:
        ipv4_address: 172.20.10.3
      backend_net:
        ipv4_address: 172.20.20.3
      storage_net:
        ipv4_address: 172.20.30.3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # 3. DATABASE & PERSISTENCE (MARIADB)
  # ============================================================================
  mariadb:
    image: mariadb:10.11
    container_name: mariadb_db_engine
    restart: unless-stopped
    command: >
      --transaction-isolation=READ-COMMITTED
      --log-bin=binlog
      --binlog-format=ROW
      --max_connections=250
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=128M
      --innodb_file_per_table=1
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_EXPORTER_USER=${MYSQL_EXPORTER_USER}
      - MYSQL_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/create-mysql-exporter-user.sh:/docker-entrypoint-initdb.d/10-create-mysql-exporter-user.sh:ro
    networks:
      backend_net:
        ipv4_address: 172.20.20.4
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================================
  # 4. IN-MEMORY CACHE & TRANSACTION LOCKING (REDIS)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: redis_cache_engine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      backend_net:
        ipv4_address: 172.20.20.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 5. OBJECT STORAGE BACKEND (MINIO S3)
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio_s3_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=https://${DOMAIN_NAME}/minio-console
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    volumes:
      - minio_data:/data
    networks:
      storage_net:
        ipv4_address: 172.20.30.4
      monitoring_net: {}
    healthcheck:
      test: ["CMD", "/bin/mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

# ==============================================================================
# NETWORK TOPOLOGY (MICROSEGMENTATION & DEFENSE-IN-DEPTH)
# ==============================================================================
networks:
  # Lớp 1: DMZ / Frontend - Tiếp nhận Traffic từ bên ngoài tới Nginx và chuyển FastCGI tới Nextcloud
  frontend_net:
    name: net_cloud_frontend
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${FRONTEND_SUBNET:-172.20.10.0/24}
          gateway: 172.20.10.1

  # Lớp 2: Internal Backend - Chỉ chứa Nextcloud, MariaDB và Redis (Nginx KHÔNG THỂ truy cập trực tiếp DB)
  backend_net:
    name: net_cloud_backend
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: ${BACKEND_SUBNET:-172.20.20.0/24}
          gateway: 172.20.20.1

  # Lớp 3: Object Storage - Kết nối Nextcloud với cụm MinIO S3
  storage_net:
    name: net_cloud_storage
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${STORAGE_SUBNET:-172.20.30.0/24}
          gateway: 172.20.30.1

  # Metrics traffic stays on an isolated network with no host-published ports.
  monitoring_net:
    name: net_cloud_monitoring
    driver: bridge
    internal: true

# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
volumes:
  nextcloud_web:
    name: vol_nextcloud_web
  mariadb_data:
    name: vol_mariadb_data
  redis_data:
    name: vol_redis_data
  minio_data:
    name: vol_minio_data 