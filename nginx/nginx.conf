user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log Formats (Extended with upstream response time & SSL info for monitoring)
    log_format  main_ext  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main_ext;
    error_log   /var/log/nginx/error.log warn;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Security Headers (Global)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;

    # Edge Rate Limiting Zones (Token Bucket Algorithm)
    # 1. General API & UI Rate Limit (30 req/s)
    limit_req_zone $binary_remote_addr zone=req_limit_zone:10m rate=30r/s;
    
    # 2. Strict Authentication Rate Limit for Login Brute Force Protection (5 req/m)
    limit_req_zone $binary_remote_addr zone=login_limit_zone:10m rate=5r/m;

    # Include virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}