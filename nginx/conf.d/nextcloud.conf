# ==============================================================================
# UPSTREAM DEFINITION
# ==============================================================================
upstream php-handler {
    server nextcloud:9000;
    keepalive 32;
}

upstream minio-console-upstream {
    server minio:9001;
}

# ==============================================================================
# HTTP REDIRECT TO HTTPS & DOCKER HEALTHCHECK
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name cloud.local localhost "";

    # Endpoint phục vụ Docker Healthcheck
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Redirect tất cả traffic còn lại sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# MAIN HTTPS SERVER (NEXTCLOUD + WEBDAV)
# ==============================================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name cloud.local localhost "";

    # Root directory trỏ tới volume mã nguồn Nextcloud chia sẻ giữa Nginx và Nextcloud-FPM
    root /var/www/html;

    # SSL/TLS Hardening
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS & SECURITY HEADERS (Khắc phục các cảnh báo Security Headers)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;

    # Tối ưu hóa Buffer cho Upload File Lớn (10GB)
    client_max_body_size 10G;
    client_body_timeout 300s;
    fastcgi_buffers 64 4K;
    fastcgi_buffering off;
    fastcgi_request_buffering off;

    # Nextcloud /.well-known Redirects (Tiêu chuẩn RFC cho CalDAV & CardDAV)
    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/webfinger {
        return 301 $scheme://$host/index.php/.well-known/webfinger;
    }
    location = /.well-known/nodeinfo {
        return 301 $scheme://$host/index.php/.well-known/nodeinfo;
    }

    # Chặn truy cập trực tiếp vào các file ẩn và file nhạy cảm
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)  { return 404; }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)              { return 404; }

    # Route chính của Nextcloud
    location / {
        rewrite ^ /index.php;
    }

    # Áp dụng Rate Limit cho trang Login chống Brute-Force
    location = /login {
        limit_req zone=login_limit_zone burst=5 nodelay;
        try_files $uri $uri/ /index.php$request_uri;
    }

    # Xử lý FastCGI qua Nextcloud-FPM Core
    location ~ ^\/(?:index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|oc[ms]-provider\/.+)\.php(?:$|\/) {
        limit_req zone=req_limit_zone burst=50 nodelay;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;

        # Tránh ghi đè header từ client
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass php-handler;

        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # Static Caching: Tự động phục vụ file tĩnh trực tiếp từ Nginx không qua PHP
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|ico|wasm|tflite|map)$ {
        try_files $uri /index.php$request_uri;
        add_header Cache-Control "public, max-age=15778463, immutable";
        access_log off;
    }

    # MinIO Console Reverse Proxy (Quản trị S3 UI)
    location /minio-console/ {
        proxy_pass http://minio-console-upstream/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        chunked_transfer_encoding off;
    }
}