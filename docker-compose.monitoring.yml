services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring_cadvisor
    restart: unless-stopped
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net

  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: monitoring_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - monitoring_net

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: monitoring_mysqld_exporter
    restart: unless-stopped
    command:
      - '--mysqld.address=mariadb:3306'
      - '--mysqld.username=${MYSQL_EXPORTER_USER}'
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD}
    networks:
      - monitoring_net
      - backend_net

  redis_exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: monitoring_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - monitoring_net
      - backend_net

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: monitoring_nginx_exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://nginx:8080/nginx_status'
    networks:
      - monitoring_net

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: monitoring_blackbox_exporter
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    networks:
      - monitoring_net
      - storage_net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: monitoring_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring_net
    depends_on:
      - cadvisor
      - node_exporter
      - mysqld_exporter
      - redis_exporter
      - nginx_exporter
      - blackbox_exporter

  grafana:
    image: grafana/grafana:11.1.0
    container_name: monitoring_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring_net

networks:
  monitoring_net:
    name: net_cloud_monitoring
    external: true
  backend_net:
    name: net_cloud_backend
    external: true
  storage_net:
    name: net_cloud_storage
    external: true

volumes:
  prometheus_data:
  grafana_data:
